name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Platform 37
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run deterministic unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Summarize unit-test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          reports = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          totals = dict.fromkeys(['tests', 'failures', 'errors', 'skipped'], 0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          text = ('Unit test reports: ' + str(len(reports)) + '\n' +
                  ', '.join(f'{key}={value}' for key, value in totals.items()))
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text + '\n')
          PY

      - name: Lint release variant
        run: ./gradlew --no-daemon lintRelease

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Preserve the existing packaging check for main and other PRs. This
      # device-retest-only branch must not prepare an AAB before owner approval.
      - name: Verify unsigned release AAB packaging outside device-retest PR
        if: github.head_ref != 'fix/tiktok-shortlink-youtube-fullscreen'
        run: ./gradlew --no-daemon bundleRelease

      - name: Assemble unsigned release APK for comparison
        if: github.head_ref != 'fix/tiktok-shortlink-youtube-fullscreen'
        run: ./gradlew --no-daemon assembleRelease

      - name: Capture release runtime dependency graph
        if: github.head_ref != 'fix/tiktok-shortlink-youtube-fullscreen'
        run: |
          mkdir -p app/build/reports
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-dependencies.txt

      - name: Measure APK, AAB, and DEX sizes
        if: github.head_ref != 'fix/tiktok-shortlink-youtube-fullscreen'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/android_size_report.py --source-sha "$SOURCE_HEAD"

      - name: Upload size and dependency baseline
        if: github.head_ref != 'fix/tiktok-shortlink-youtube-fullscreen'
        uses: actions/upload-artifact@v4
        with:
          name: size-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/size/
            app/build/reports/release-dependencies.txt
          if-no-files-found: error
          retention-days: 14

      - name: Assemble isolated optimized link QA APK
        if: github.head_ref == 'fix/viewer-loading-errors'
        run: ./gradlew --no-daemon assembleLinkQa

      - name: Verify link QA identity and optimization
        if: github.head_ref == 'fix/viewer-loading-errors'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/linkQa/app-linkQa.apk"
          test -s "$apk"
          test -s app/build/outputs/mapping/linkQa/mapping.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/linkQa/QA-BADGING.txt
          python3 - <<'PY'
          from pathlib import Path
          badging = Path('app/build/outputs/apk/linkQa/QA-BADGING.txt').read_text()
          for expected in (
              "package: name='io.github.falker47.socialviewer.linkqa'",
              "versionCode='8'",
              "versionName='0.1.7-link-qa'",
              "application-label:'SocialViewer Link QA'",
          ):
              assert expected in badging, expected
          assert 'application-debuggable' not in badging, 'QA must be non-debuggable'
          PY
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          {
            echo "Source: $SOURCE_HEAD"
            echo "CI checkout: $(git rev-parse HEAD)"
            echo "App: io.github.falker47.socialviewer.linkqa / SocialViewer Link QA"
            echo "R8-optimized, non-debuggable; Android debug certificate generated by CI."
            echo "Separate from the Play app; do not change its defaults or site data."
            echo "Paste the test link in Link QA. Keep QA domain associations disabled."
            echo "YouTube is keyless in CI and cannot validate production YouTube behavior."
            echo "Not a Play release. Physical link-loading acceptance is pending."
            sha256sum "$apk"
          } > app/build/outputs/apk/linkQa/QA-README.txt
          cat app/build/outputs/apk/linkQa/QA-README.txt

      - name: Upload isolated link QA APK
        if: github.head_ref == 'fix/viewer-loading-errors'
        uses: actions/upload-artifact@v4
        with:
          name: socialviewer-link-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/linkQa/*.apk
            app/build/outputs/apk/linkQa/QA-README.txt
            app/build/outputs/apk/linkQa/QA-BADGING.txt
            docs/LINK_LOADING_RETEST.md
          if-no-files-found: error
          retention-days: 14

      - name: Record debug artifact provenance and limitations
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "PR/source head: $SOURCE_HEAD"
            echo "CI checkout: $(git rev-parse HEAD)"
            echo "Debug APK only; no production API key or release signing credentials."
            echo "YouTube device retest requires a local build with the existing API key and an authorized signing certificate."
            echo "Do not install this APK over a Play-signed app; Android signatures differ."
            echo "See docs/DEVICE_RETEST_PR25.md for the physical-device gate."
            sha256sum app/build/outputs/apk/debug/*.apk
          } > app/build/outputs/apk/debug/RETEST-README.txt
          cat app/build/outputs/apk/debug/RETEST-README.txt

      - name: Upload keyless debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socialviewer-debug-keyless-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/RETEST-README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          retention-days: 14
